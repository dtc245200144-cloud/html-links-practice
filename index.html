<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên Kết Yêu Thích Của Tôi</title>
</head>
<body>

    <h1>Liên kết yêu thích của tôi</h1>

    <ul>
        <!-- 1. Liên kết mở trong tab mới bằng target="_blank" -->
        <li>
            <a href="https://www.google.com" target="_blank">Trang chủ Google (Mở trong tab mới)</a>
        </li>

        <!-- 2. Liên kết đến file HTML khác cùng thư mục -->
        <li>
            <a href="about.html">Trang Giới Thiệu (About)</a>
        </li>

        <!-- 3. Liên kết gửi Email (mailto:) -->
        <li>
            <a href="mailto:your.email@example.com">Gửi email cho tôi</a>
        </li>

        <!-- 4. Thêm trang web bên ngoài khác -->
        <li>
            <a href="https://github.com" target="_blank">Trang chủ GitHub</a>
        </li>
    </ul>

</body>
</html>
